name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Set up pnpm and Node.js, install dependencies
      uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
      with:
        cache: true
        require-lockfile: true

    - name: Unit tests
      run: pnpm run test:unit

    - name: Lint
      run: pnpm run lint

    - name: Build
      run: pnpm run build

    - name: Check links
      run: pnpm run test:links
